title: North American Epic 2025
author: Mike Mossing

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - colon_fence
    - smartquotes

html:
  use_issues_button: false
  use_repository_button: false
  extra_footer: |
    GPS data © Strava · Map tiles © OpenTopoMap (CC-BY-SA)
    <script src="https://strava-embeds.com/embed.js"></script>

sphinx:
  config:
    html_show_copyright: false
    html_extra_path: ["content/maps"]
    html_css_files:
      - custom.css
    exclude_patterns:
      - "README.md"
      - "content/planning/README.md"
      - "content/planning/how-to-generate-poi-guides.md"
      - "content/planning/nae25_stages_106-109_road_conditions_safety.md"
